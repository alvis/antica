appId: ${APP_ID}
---
- runFlow: support/dismiss-dev-logbox.yaml
- tapOn:
    id: collection-add-item
- tapOn:
    id: capture-kind-single
- tapOn:
    id: capture-media-import
# The system photo picker labels its controls in the emulator's system language.
- tapOn: ${MEDIA_PICKER_ITEM}
- tapOn: Done
- tapOn:
    id: capture-media-continue
- tapOn:
    id: capture-components-continue
- tapOn:
    id: capture-voice-original-words
- inputText: ${ORIGINAL_WORDS}
- tapOn:
    id: capture-voice-confirm-words
- assertVisible:
    id: capture-voice-words-confirmed
- tapOn:
    id: capture-voice-continue
- tapOn:
    id: capture-details-name
- inputText: ${RECORD_NAME}
# Submit the field to close the keyboard, which otherwise covers Continue.
- pressKey: Enter
- waitForAnimationToEnd
# The collector's general locations are listed above Continue, and an account
# that already holds several pushes it below the fold.
- scrollUntilVisible:
    element:
      id: capture-details-continue
    direction: DOWN
- tapOn:
    id: capture-details-continue
- runFlow: support/dismiss-dev-logbox.yaml
- tapOn:
    id: capture-save
- assertVisible: ${RECORD_NAME}
- stopApp
- launchApp
# A cold start on a loaded host can take well over a minute in dev builds.
# Collection rows are labelled "<item code>, <name>", which holds no interface text.
- extendedWaitUntil:
    visible: '.*, ${RECORD_NAME}'
    timeout: 120000
- tapOn: '.*, ${RECORD_NAME}'
- assertVisible: ${RECORD_NAME}
