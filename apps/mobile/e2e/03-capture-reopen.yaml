appId: ${APP_ID}
---
- runFlow: support/dismiss-dev-logbox.yaml
- tapOn: Add item
- tapOn: Single item
- tapOn: Import file
- tapOn: ${MEDIA_PICKER_ITEM}
- tapOn: Done
- tapOn: Continue
- tapOn: Continue
- tapOn: Original words
- inputText: ${ORIGINAL_WORDS}
- tapOn: Confirm original words
- assertVisible: Original words confirmed
- tapOn: Continue
- tapOn: Name
- inputText: ${RECORD_NAME}
# Submit the field to close the keyboard, which otherwise covers Continue.
- pressKey: Enter
- waitForAnimationToEnd
- tapOn: Continue
- runFlow: support/dismiss-dev-logbox.yaml
# The step heading also reads "Save"; index 1 is the button until GAP01 adds testIDs.
- tapOn:
    text: Save
    index: 1
- assertVisible: ${RECORD_NAME}
- stopApp
- launchApp
- tapOn: '.*, ${RECORD_NAME}'
- assertVisible: ${RECORD_NAME}
