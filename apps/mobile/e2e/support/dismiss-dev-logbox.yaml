# Development builds show React Native LogBox for console errors and warnings;
# it covers the bottom actions. Close it when present. Release builds never
# show it (I9). Limits: each check runs once per call, so a LogBox that appears
# afterwards stays until the next call; the warning-toast close button is
# unlabelled and tapped by position, tuned for the Pixel 7 test AVD.
appId: ${APP_ID}
---
- runFlow:
    when:
      visible: Console Error
    commands:
      - tapOn: Dismiss
- runFlow:
    when:
      visible: .*Can't perform a React state update.*
    commands:
      - tapOn: .*Can't perform a React state update.*
      - tapOn: Dismiss
- runFlow:
    when:
      visible: Open debugger to view warnings\.
    commands:
      # The warning toast's close button has no label; it sits at the toast's right edge.
      - tapOn:
          point: 92%,92%
