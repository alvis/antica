# Proves SC-10 on the camera record from 04: a question gets a reply without a
# card; a labelled 「」 request gets one card with name and period rows; the
# collector confirms the name, rejects the period, and applies; the period row
# stays locked as not applied, the record reflects only the confirmed field, its
# change history lists the name as accepted and the period as skipped, and the
# history links back to the requesting message, which opens fully in view.
# Replies come from the deterministic development model through the local drain
# loop, so their text is the same in every interface language. Controls and
# states are selected by testID; the card title check proves the language.
appId: ${APP_ID}
---
- launchApp
# A cold start on a loaded host can take well over a minute in dev builds.
- extendedWaitUntil:
    visible: '.*, ${RECORD_NAME}'
    timeout: 120000
- runFlow: support/dismiss-dev-logbox.yaml
- tapOn: '.*, ${RECORD_NAME}'
- extendedWaitUntil:
    visible:
      id: record-messages-entry
    timeout: 60000
- scrollUntilVisible:
    element:
      id: record-messages-entry
    direction: DOWN
- tapOn:
    id: record-messages-entry
- extendedWaitUntil:
    visible:
      id: record-message-input
    timeout: 60000
- runFlow: support/dismiss-dev-logbox.yaml

# 1. A question ending in ？ gets a reply and no edit card.
- tapOn:
    id: record-message-input
- inputText: 這件器物的年代可以怎麼判斷？
# I17: the composer stays above the soft keyboard, so Send is tapped with it open
- tapOn:
    id: record-message-send
- extendedWaitUntil:
    visible: '開發示範：這是提問.*'
    timeout: 90000
- assertNotVisible:
    id: 'record-message-card-.*'

# 2. A request with both values in 「」 gets one card with two rows; nothing is applied yet.
- tapOn:
    id: record-message-input
- inputText: 名稱改成「${NEW_NAME}」，年代改成「${NEW_PERIOD}」
- tapOn:
    id: record-message-send
# With the keyboard still open only the new card's foot is in view; dragging
# the thread back toward the reply closes the keyboard and returns its space
# (I17). The drag starts on the thread, above the lifted composer.
- extendedWaitUntil:
    visible:
      id: 'record-message-card-apply-.*'
    timeout: 90000
- swipe:
    start: 50%, 20%
    end: 50%, 40%
- scrollUntilVisible:
    element: '開發示範：已建議修改「名稱」、「年代」.*'
    direction: UP
- scrollUntilVisible:
    element:
      id: 'record-message-card-apply-.*'
    direction: DOWN
- assertVisible:
    id: 'record-message-card-status-ready-.*'
- runFlow:
    when:
      true: ${APP_LOCALE == 'en'}
    commands:
      - assertVisible: Suggested changes
- runFlow:
    when:
      true: ${APP_LOCALE == 'zh-Hant'}
    commands:
      - assertVisible: 建議變更
- assertVisible:
    id: 'record-message-card-confirm-name-.*'
- assertVisible:
    id: 'record-message-card-reject-period-.*'
- assertNotVisible:
    id: 'record-message-card-applied-.*'

# 3. Confirm the name, reject the period, then apply both decisions. The name
#    is applied, the period stays locked as not applied, and no toggle remains.
- tapOn:
    id: 'record-message-card-confirm-name-.*'
- tapOn:
    id: 'record-message-card-reject-period-.*'
- tapOn:
    id: 'record-message-card-apply-.*'
- extendedWaitUntil:
    visible:
      id: 'record-message-card-status-resolved-.*'
    timeout: 60000
- assertVisible:
    id: 'record-message-card-applied-name-.*'
- assertNotVisible:
    id: 'record-message-card-applied-period-.*'
- assertVisible:
    id: 'record-message-card-skipped-period-.*'
- assertNotVisible:
    id: 'record-message-card-skipped-name-.*'
- assertNotVisible:
    id: 'record-message-card-confirm-.*'
- assertNotVisible:
    id: 'record-message-card-reject-.*'
- assertNotVisible:
    id: 'record-message-card-apply-.*'

# 4. The record shows the new name; the period was not applied.
- back
- extendedWaitUntil:
    visible: ${NEW_NAME}
    timeout: 60000
- assertNotVisible: .*${NEW_PERIOD}.*

# 5. The change history lists the accepted name and the skipped period, and
#    links back to the requesting message.
- scrollUntilVisible:
    element:
      id: record-open-history
    direction: DOWN
- tapOn:
    id: record-open-history
- extendedWaitUntil:
    visible:
      id: record-history
    timeout: 60000
- assertVisible:
    id: 'record-history-entry-.*-name-accepted'
- assertVisible:
    id: 'record-history-entry-.*-period-skipped'
- tapOn:
    id: 'record-history-entry-.*-name-source'
- extendedWaitUntil:
    visible:
      id: record-messages-opened-from-history
    timeout: 60000
- assertVisible: '名稱改成「${NEW_NAME}」.*'
