# Captures a photo through the in-app camera (the emulator's virtual scene),
# saves the record, and confirms the upload finished (A2). The
# saved record waits for an explicit Analyse (B06); the run's describe action
# opens capture linked to it, and the confirmed words mark it supplied (C04).
# Runs after 02-authenticate: it relaunches without clearing state and relies
# on that session.
appId: ${APP_ID}
---
- launchApp
# A cold start on a loaded host can take well over a minute in dev builds.
- extendedWaitUntil:
    visible:
      id: collection-add-item
    timeout: 120000
- runFlow: support/dismiss-dev-logbox.yaml
- tapOn:
    id: collection-add-item
- tapOn:
    id: capture-kind-single
- tapOn:
    id: capture-media-photo
# The permission dialog is system UI in the emulator's system language.
- runFlow:
    when:
      visible: While using the app
    commands:
      - tapOn: While using the app
# B02: the in-app camera shows the emulator's virtual scene; the shot joins the
# draft at once and the camera stays open.
- extendedWaitUntil:
    visible:
      id: capture-camera-preview
    timeout: 30000
- tapOn:
    id: capture-camera-shutter
- extendedWaitUntil:
    visible:
      id: capture-camera-shot-count
      text: '.* 1 .*'
    timeout: 30000
# The last-shot thumbnail opens the grid to review the photo.
- tapOn:
    id: capture-camera-last-shot
- assertVisible:
    id: capture-grid-tile-1
- tapOn:
    id: capture-grid-next
- tapOn:
    id: capture-voice-continue
- tapOn:
    id: capture-details-name
- inputText: ${RECORD_NAME}
# Submit the field to close the keyboard, which otherwise covers Continue.
- pressKey: Enter
- waitForAnimationToEnd
# The collector's general locations are listed above Continue, and an account
# that already holds several pushes it below the fold.
- scrollUntilVisible:
    element:
      id: capture-details-continue
    direction: DOWN
- tapOn:
    id: capture-details-continue
- runFlow: support/dismiss-dev-logbox.yaml
- tapOn:
    id: capture-save
- assertVisible: ${RECORD_NAME}
# B06: saving never starts an analysis; the record offers Analyse instead.
- assertVisible:
    id: record-analysis-status-unanalysed
- assertVisible:
    id: record-analyse
# The record's action and message cards push the media status below the fold.
# Any state after the upload counts; the drain loop may already have processed it.
- scrollUntilVisible:
    element:
      id: record-media-.*-(uploaded|processing|ready)
    direction: DOWN
    timeout: 30000
# B06: Analyse starts one run and follows it in the record's 對話 segment,
# then opens the run's 建議 segment once the drain loop completes it. With no
# collector observations this model returns zero proposals, so no empty-list link is offered.
- scrollUntilVisible:
    element:
      id: record-analyse
    direction: UP
- tapOn:
    id: record-analyse
- extendedWaitUntil:
    visible:
      id: record-analysis-thread-finished
    timeout: 120000
- assertNotVisible:
    id: analysis-open-suggestions
- tapOn:
    id: record-segment-suggestions
# C04: the development model suggests one describe action without a check;
# its card sits in the analysis details under the suggestions.
# Selectors name the first card, so a second suggested action cannot match.
- extendedWaitUntil:
    visible:
      id: analysis-suggestions
    timeout: 60000
- scrollUntilVisible:
    element:
      id: analysis-details-toggle
    direction: DOWN
    timeout: 60000
- tapOn:
    id: analysis-details-toggle
- scrollUntilVisible:
    element:
      id: 'analysis-action-describe-.*'
      index: 0
    direction: DOWN
    timeout: 120000
- assertVisible:
    id: 'analysis-action-status-pending-.*'
    index: 0
- tapOn:
    id: 'analysis-action-describe-.*'
    index: 0
- extendedWaitUntil:
    visible:
      id: capture-action-link
    timeout: 60000
- assertVisible:
    id: capture-action-unlinked
- tapOn:
    id: capture-voice-original-words
- inputText: Foot ring unglazed
# I17: the screen lifts above the open keyboard, so the rest of the step scrolls into view
- scrollUntilVisible:
    element:
      id: capture-voice-confirm-words
    direction: DOWN
- tapOn:
    id: capture-voice-confirm-words
- scrollUntilVisible:
    element:
      id: capture-action-finish
    direction: UP
    timeout: 30000
- tapOn:
    id: capture-action-finish
# PT-13: back on the run, the action keeps its supplied state and offers no
# second answer; nothing re-runs the analysis by itself.
- extendedWaitUntil:
    visible:
      id: analysis-suggestions
    timeout: 60000
- scrollUntilVisible:
    element:
      id: analysis-details-toggle
    direction: DOWN
    timeout: 60000
- tapOn:
    id: analysis-details-toggle
- scrollUntilVisible:
    element:
      id: 'analysis-action-status-supplied-.*'
      index: 0
    direction: DOWN
    timeout: 60000
- assertNotVisible:
    id: 'analysis-action-describe-.*'
    index: 0
